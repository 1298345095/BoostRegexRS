[package]
name = "icu4x-compat-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
icu_casemap = "=2.0.0"
icu_properties = "=2.0.0"
# Keep Unicode 16 data fixed independently of semver-compatible updates.
icu_casemap_data = "=2.0.0"
icu_properties_data = "=2.0.0"
icu_collator = "=2.0.0"
icu_collator_data = "=2.0.0"
icu_locale_core = "=2.0.0"
icu_locale = "=2.0.0"
icu_locale_data = "=2.0.0"
icu_provider = "=2.0.0"
icu_normalizer = "=2.0.0"
icu_normalizer_data = "=2.0.0"
# The simple-case component uses Cow<str>; enable its documented alloc impl.
zerofrom = { version = "0.1", features = ["alloc"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
