name: Native Rust collation checks

on:
  workflow_dispatch:
  push:
    branches:
      - work/root-primary-cloud
    paths:
      - .github/workflows/native-rust.yml
      - tools/ci/**
      - tools/icu-probe/primary/rust/**
      - tools/icu-probe/primary/data/**
      - docs/adr/**

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python: python
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
          - runner: macos-15
            target: aarch64-apple-darwin
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the current stable native toolchain
        shell: bash
        run: rustup toolchain install stable-${{ matrix.target }} --profile minimal --component rustfmt --component clippy
      - name: Execute native Rust checks and preserve exact versions
        shell: bash
        run: |
          ${{ matrix.python }} -B tools/ci/native_rust.py --target ${{ matrix.target }} \
            --output docs/research/assets/platforms/actions-${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.target }}
      - name: Preserve platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-rust-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/research/assets/platforms/actions-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
